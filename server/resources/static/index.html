<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>智慧自习室预约与管理系统（课程 Demo）</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <div id="app"><div class="loading">正在加载系统……</div></div>

  <dialog id="modal">
    <form id="modal-form">
      <div class="dialog-head">
        <h2 id="modal-title"></h2>
        <button type="button" class="icon-button" data-close aria-label="关闭">×</button>
      </div>
      <div id="modal-body"></div>
      <p id="modal-error" class="error" role="alert"></p>
      <div class="dialog-foot">
        <button type="button" class="button" data-close>取消</button>
        <button type="submit" class="button primary">保存</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
